name: Blog

# Dois jobs:
#   build     — gera o HTML do blog a partir do Markdown, commita o resultado
#               no próprio repositório e publica o deploy.zip como artefato;
#   publicar  — envia esse mesmo zip por FTPS para o public_html.
#
# O HTML gerado é commitado (em vez de existir só dentro do pacote) para que o
# repositório permaneça servível como está: seja qual for o método de deploy —
# este FTP, um git pull no servidor, upload manual — os arquivos prontos já
# estão lá, e nada precisa buildar no host.
#
# Configuração do FTP e o que o job garante: docs/deploy.md.

# Sem allowlist de paths, de propósito. O filtro original listava só o que
# afeta o BLOG — mas este workflow também empacota o deploy.zip, e aí qualquer
# arquivo que vá para o public_html precisa disparar uma execução nova.
#
# A allowlist já causou um problema real: uma correção em admin/.htaccess não
# disparou o workflow, e o deploy.zip disponível continuou com a versão
# anterior do arquivo. Uma lista de exclusão erra para o lado seguro — no
# máximo roda à toa, o que custa ~20 segundos.
#
# Cuidado ao mexer aqui: NÃO ignore "**/*.md" — content/blog/*.md é a fonte
# dos posts.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: blog-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Em pull request só validamos: nada é commitado a partir de um PR,
      # inclusive porque um PR de fork não deve conseguir escrever no repo.
      - name: Validar posts
        if: github.event_name == 'pull_request'
        run: npm run check:blog

      # Roda o empacotador no PR só para exercitar suas barreiras — o zip é
      # descartado. É aqui que um arquivo de credencial que tenha ido parar
      # dentro de assets/ por engano trava a esteira, antes do merge.
      - name: Validar o pacote de deploy
        if: github.event_name == 'pull_request'
        run: npm run package

      - name: Gerar o blog
        if: github.event_name != 'pull_request'
        run: npm run build:blog

      - name: Commitar o HTML gerado
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- blog en/blog feed.xml sitemap.xml; then
            echo "Nada mudou no HTML gerado."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog en/blog feed.xml sitemap.xml
          git commit -m "Blog: regenerar HTML a partir do Markdown

          Commit automático do workflow .github/workflows/blog.yml.
          Fonte: content/blog/. Não edite blog/*.html à mão — o próximo
          build sobrescreve."
          git push

      # Este zip contém exatamente o que vai dentro do public_html — sem o
      # Markdown fonte, sem o gerador, sem node_modules — e já com os dotfiles
      # (.htaccess), que se perdem quando se arrasta pasta pelo navegador.
      # É o que o job "publicar" envia por FTPS, e também o que se baixa para
      # subir à mão se o deploy automático estiver fora do ar.
      - name: Empacotar para upload
        if: github.event_name != 'pull_request'
        run: npm run package

      - name: Publicar o deploy.zip como artefato
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: deploy
          path: deploy.zip
          retention-days: 30
          if-no-files-found: error

    # O job de build precisa de permissão de escrita só quando não é PR.
    permissions:
      contents: write

  # ====================================================================
  # Publicação no servidor
  #
  # Job separado do build de propósito, por dois motivos:
  #
  # 1. Concorrência. O build cancela execução anterior (cancel-in-progress),
  #    o que é certo para um build e ERRADO para um upload: cancelar no meio
  #    deixa o site pela metade. Este job tem grupo próprio e não cancela —
  #    dois pushes seguidos enfileiram, não se atropelam.
  # 2. Permissão. Aqui não se escreve no repositório; só se lê o artefato.
  #
  # Publica o MESMO zip que o build produziu, em vez de gerar de novo: o que
  # vai ao ar é byte a byte o artefato que fica guardado para conferência.
  # ====================================================================
  publicar:
    needs: build
    # Nunca em pull request (não teria acesso aos secrets, e um PR de fork
    # jamais pode alcançar o servidor) e nunca fora da main.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    concurrency:
      group: deploy-ftp
      cancel-in-progress: false
    steps:
      # Sem credencial configurada o job não falha: só avisa e sai. Assim o
      # repositório continua buildando normalmente antes de alguém criar os
      # secrets — e um fork nunca vê um workflow vermelho por isso.
      - name: Há credenciais de FTP?
        id: cred
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -n "$FTP_HOST" ] && [ -n "$FTP_USER" ] && [ -n "$FTP_PASSWORD" ]; then
            echo "ok=yes" >> "$GITHUB_OUTPUT"
          else
            echo "ok=no" >> "$GITHUB_OUTPUT"
            echo "::notice::FTP_HOST/FTP_USER/FTP_PASSWORD não configurados — pulando a publicação. Baixe o artefato 'deploy' e suba à mão."
          fi

      - name: Baixar o pacote gerado pelo build
        if: steps.cred.outputs.ok == 'yes'
        uses: actions/download-artifact@v4
        with:
          name: deploy

      - name: Abrir o pacote e conferir o conteúdo
        if: steps.cred.outputs.ok == 'yes'
        run: |
          set -euo pipefail
          unzip -q deploy.zip -d site

          # As mesmas barreiras do empacotador, de novo aqui: o que impede um
          # deploy ruim tem que estar do lado de quem publica, não só do lado
          # de quem empacota. Um artefato adulterado ou um empacotador
          # alterado no futuro morrem aqui.
          test -f site/.htaccess || { echo "sem .htaccess no pacote — abortando"; exit 1; }
          test -f site/index.html || { echo "sem index.html no pacote — abortando"; exit 1; }
          if find site -name 'bocchi-*.php' -o -name '.env*' -o -name '*.key' -o -name '*.pem' | grep -q .; then
            echo "o pacote contém arquivo de credencial — abortando"; exit 1
          fi
          echo "pacote com $(find site -type f | wc -l) arquivo(s), $(du -sh site | cut -f1)"

      - name: Instalar o lftp
        if: steps.cred.outputs.ok == 'yes'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Enviar por FTPS
        if: steps.cred.outputs.ok == 'yes'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          # O lftp lê a senha desta variável com --env-password. Passar por
          # linha de comando a deixaria visível no /proc e em qualquer trace.
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          # "/" porque a conta de FTP dedicada é presa (chroot) ao próprio
          # public_html: ao logar, ela JÁ está lá dentro, e um "/public_html"
          # apontaria para um subdiretório que não existe. Se a conta usada não
          # for presa, defina FTP_REMOTE_DIR com o caminho completo — a
          # conferência abaixo detecta o caso e falha explicando.
          REMOTE_DIR: ${{ vars.FTP_REMOTE_DIR || '/' }}
          # Verificação do certificado. Ligada por padrão. Só desligue se o
          # FTP_HOST for um IP (certificado nenhum casa com IP) e você tiver
          # decidido conscientemente: com ela desligada o canal continua
          # cifrado, mas deixa de haver garantia de com QUEM se está falando.
          VERIFY_CERT: ${{ vars.FTP_VERIFY_CERT || 'true' }}
          # Apagar no servidor o que sumiu do repositório (post despublicado,
          # página renomeada). LIGADO por padrão.
          #
          # Ficou desligado por precaução, e a precaução saiu cara: o post
          # "como-este-blog-funciona" foi marcado draft:true, sumiu do repo, do
          # sitemap e do feed — e continuou respondendo 200 em
          # /blog/como-este-blog-funciona, indexável, por semanas. Despublicar
          # que não despublica é a pior falha possível aqui, porque não deixa
          # rastro: o repositório mostra o estado certo e o site mostra outro.
          #
          # O conteúdo do public_html foi conferido contra o pacote antes desta
          # mudança: só havia esse arquivo a mais. Se um dia for preciso manter
          # no servidor algo que não venha deste repositório, defina a variável
          # FTP_DELETE_STALE como "false" em Settings > Secrets and variables >
          # Actions > Variables — e anote ali o que é, porque o espelho volta a
          # ser a única fonte de verdade no dia em que ela for removida.
          DELETE_STALE: ${{ vars.FTP_DELETE_STALE || 'true' }}
        run: |
          set -euo pipefail

          COMUM="
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate $VERIFY_CERT;
            set cmd:fail-exit true;
            set net:max-retries 3;
            set net:timeout 20;
            open -u '$FTP_USER' --env-password 'ftp://$FTP_HOST';
          "

          # Guarda contra destino errado, por CONTEÚDO e não por nome de
          # caminho. O nome não serve: a conta de FTP dedicada é presa ao
          # public_html e enxerga o próprio diretório como "/", então exigir
          # que o caminho contenha "public_html" reprovaria o destino certo e
          # aprovaria um "/" que, numa conta não presa, é a raiz da conta —
          # onde moram bocchi-smtp.php, bocchi-oauth.php e .bocchi-state.
          # Listar e olhar o que tem lá dentro responde a pergunta de verdade:
          # "este diretório é a raiz do site?".
          lftp -c "$COMUM cd '$REMOTE_DIR'; cls -1;" > remoto.txt || {
            echo "não consegui listar $REMOTE_DIR no servidor"; exit 1; }

          for proibido in bocchi-smtp.php bocchi-oauth.php .bocchi-state domains public_html; do
            if grep -qxF "$proibido" remoto.txt; then
              echo "ABORTANDO: $REMOTE_DIR contém '$proibido' — isto é a raiz da conta, não o public_html."
              echo "Publicar aqui espalharia o site por cima das credenciais. Ajuste a variável FTP_REMOTE_DIR."
              exit 1
            fi
          done
          if ! grep -qxF 'index.html' remoto.txt; then
            echo "ABORTANDO: não achei index.html em $REMOTE_DIR — este diretório não parece a raiz do site."
            echo "Conteúdo encontrado:"; head -20 remoto.txt
            exit 1
          fi
          echo "destino conferido: $REMOTE_DIR é a raiz do site"

          DELETE_FLAG=""
          if [ "$DELETE_STALE" = "true" ]; then
            DELETE_FLAG="--delete"
            echo "modo: espelho com apagamento do que sumiu"
          else
            echo "modo: só envio (arquivos removidos do repo continuam no servidor)"
          fi

          # ftp:ssl-force recusa o servidor que não ofereça TLS, em vez de cair
          # para texto claro. ssl-protect-data estende o TLS ao canal de dados:
          # sem ele só o login vai cifrado e o conteúdo dos arquivos sobe em
          # claro. cmd:fail-exit faz o job falhar de verdade quando o lftp
          # tropeça, em vez de sair 0 com o site pela metade.
          lftp -c "
            $COMUM
            set mirror:parallel-transfer-count 4;
            mirror --reverse --verbose --no-perms $DELETE_FLAG 'site' '$REMOTE_DIR';
          "

      - name: Conferir o site no ar
        if: steps.cred.outputs.ok == 'yes'
        run: |
          set -euo pipefail

          # Um deploy que "passou" mas deixou o site fora do ar é o pior
          # resultado possível: ninguém olha um check verde. O segundo pior é
          # este passo reprovar sempre — e foi o que aconteceu por semanas.
          #
          # O lftp reescreve cada arquivo como "remove + transfere", .htaccess
          # incluído. Na janela em que ele não existe (ou existe pela metade),
          # o LiteSpeed responde 403 ao site INTEIRO. Esta verificação rodava
          # cerca de 1 segundo depois do último arquivo e lia exatamente essa
          # janela: quatro deploys seguidos ficaram vermelhos com o site
          # perfeito no ar.
          #
          # O `--retry` do curl não cobria o caso. Ele repete em erro de
          # conexão, timeout e 408/429/5xx; 403 não está na lista, então o
          # `--retry 3` que estava aqui nunca repetiu uma única vez.
          #
          # Um check que mente sempre é pior que check nenhum: ensina a ignorar
          # o vermelho, e aí o dia em que o deploy quebrar de verdade passa
          # batido. Por isso o retry abaixo é real — e o veredito continua
          # estrito: esgotadas as tentativas, reprova.
          verifica() {
            local url="$1" esperado="$2" code=000
            for _ in $(seq 1 12); do
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$url" || echo 000)
              if [ "$code" = "$esperado" ]; then
                printf '  ok     %-46s %s\n' "$url" "$code"
                return 0
              fi
              sleep 5
            done
            printf '  FALHOU %-46s devolveu %s, esperado %s\n' "$url" "$code" "$esperado"
            return 1
          }

          # Margem para o servidor reler o .htaccess recém-escrito antes da
          # primeira tentativa. Não substitui o retry: encurta o caminho feliz.
          sleep 10

          falhas=0

          # O site de pé, nas rotas que representam cada mecanismo: a home
          # (arquivo direto), o blog (diretório), o token.php (PHP executando)
          # e o security.txt, que fica sob .well-known/ e depende de o
          # <FilesMatch "^\."> do .htaccess casar só com o NOME do arquivo.
          for url in https://bocchi.company/ \
                     https://bocchi.company/blog/ \
                     https://bocchi.company/token.php \
                     https://bocchi.company/.well-known/security.txt; do
            verifica "$url" 200 || falhas=1
          done

          # O .htaccess é o que faz os headers de segurança e o bloqueio dos
          # includes funcionarem. Se ele não subiu, isto pega.
          verifica https://bocchi.company/antispam.php 403 || falhas=1

          # O www tem que redirecionar para o apex. Enquanto não redirecionava,
          # o site inteiro existia em duplicata e o Search Console contava as
          # gêmeas como "página alternativa com tag canônica". Uma falha aqui
          # não derruba nada — por isso ninguém percebe sem uma verificação.
          destino=""
          for _ in $(seq 1 12); do
            destino=$(curl -sS -o /dev/null -w '%{redirect_url}' --max-time 20 https://www.bocchi.company/sobre || echo '')
            [ "$destino" = "https://bocchi.company/sobre" ] && break
            sleep 5
          done
          if [ "$destino" = "https://bocchi.company/sobre" ]; then
            printf '  ok     %-46s 301\n' "www.bocchi.company/sobre"
          else
            printf "  FALHOU %-46s foi para '%s'\n" "www.bocchi.company/sobre" "${destino:-nada}"
            falhas=1
          fi

          [ "$falhas" = "0" ] || { echo "verificação pós-deploy reprovou — veja as linhas FALHOU acima"; exit 1; }
          echo "site no ar, .htaccess ativo e www redirecionando"
